name: Test, build and deploy

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/deploy-to-docker.yaml"
      - "src/**"
      - "**/*.ts"
      - "**/*.tsx"
      - "public/**"
      - "next.config.*"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.ts"
      - "postcss.config.mjs"
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/deploy-to-docker.yaml"
      - "src/**"
      - "**/*.ts"
      - "**/*.tsx"
      - "public/**"
      - "next.config.*"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.ts"
      - "postcss.config.mjs"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Docker daemon with mirror
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors":["https://docker.1ms.run"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || sudo service docker restart

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from package.json
        id: ver
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Version: $VER"

      - name: Extract metadata for GHCR
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          # 传入 git sha 作为稳定 buildId，避免滚动部署前后端 build 不一致
          build-args: |
            BUILD_ID=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
            CONTAINER="${{ github.event.repository.name }}"
            POT_CONTAINER="bgutil-pot-provider"
            ENV_FILE="/opt/1panel/apps/openresty/openresty/www/sites/parse.shenzjd.com/index/.env"
            # PO Token 提供方（bgutil-ytdlp-pot-provider HTTP server）：
            # 数据中心 IP 下绕过 YouTube "Sign in to confirm you're not a bot" 人机验证。
            # 监听 127.0.0.1:4416，仅本机 yt-dlp 访问，不对外暴露。
            sudo docker pull brainicism/bgutil-ytdlp-pot-provider:latest
            sudo docker stop "$POT_CONTAINER" || true
            sudo docker rm "$POT_CONTAINER" || true
            sudo docker run -d \
              --name "$POT_CONTAINER" \
              --restart unless-stopped \
              -p 127.0.0.1:4416:4416 \
              brainicism/bgutil-ytdlp-pot-provider:latest
            sudo docker pull "$IMAGE"
            sudo docker stop "$CONTAINER" || true
            sudo docker rm "$CONTAINER" || true
            ENV_FLAGS=""
            if [ -f "$ENV_FILE" ]; then
              ENV_FLAGS="--env-file $ENV_FILE"
            fi
            sudo docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              $ENV_FLAGS \
              -p 5269:3000 \
              "$IMAGE"
            sudo docker image prune -f
