name: Sync upstream (merge from fixed upstream)

on:
  schedule:
    - cron: "0 3 * * *" # 每天 03:00 UTC 运行
  workflow_dispatch:

permissions:
  contents: write
  # 注意：不能在这里声明 workflows: write——它不是 workflow 文件 permissions key 的
  # 合法值（GitHub 报 "Unexpected value 'workflows'"），且 GITHUB_TOKEN 永远拿不到
  # workflows 权限（平台硬性安全边界，任何 permissions 声明都无法授予）。
  # 推送 .github/workflows/ 下的文件只能靠带 workflow 权限的 PAT（见 SYNC_TOKEN）。

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 只在 fork 里运行；上游仓库自身无需自同步，避免每天空跑消耗 Actions 配额
    if: github.repository != 'wu529778790/parse.shenzjd.com'
    env:
      # 固定上游仓库与分支（按需改动）
      UPSTREAM_REPO: wu529778790/parse.shenzjd.com
      UPSTREAM_BRANCH: main
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # 可选：fork 里配置 SYNC_TOKEN（带 workflow 权限的 PAT：fine-grained 勾选
      # Contents+Workflows 读写，或 classic 勾选 workflow scope）即可连
      # .github/workflows/ 一起同步；未配置时 workflow 文件保持 fork 本地版本
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 配置了 SYNC_TOKEN 就用它（能推送 workflow 文件），否则退回 GITHUB_TOKEN
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git || git remote set-url upstream https://github.com/${UPSTREAM_REPO}.git
          git fetch upstream --tags --prune

      - name: Determine branches
        id: b
        run: |
          local_default="${DEFAULT_BRANCH:-main}"
          # 兜底：若无 origin/HEAD，尝试识别 main/master
          if ! git rev-parse --verify "origin/$local_default" >/dev/null 2>&1; then
            if git rev-parse --verify origin/main >/dev/null 2>&1; then local_default=main; else local_default=master; fi
          fi
          echo "local_default=$local_default" >> $GITHUB_OUTPUT
          echo "upstream_default=${UPSTREAM_BRANCH}" >> $GITHUB_OUTPUT

      - name: Merge upstream -> fork (no fast-forward)
        run: |
          set -e
          git checkout "${{ steps.b.outputs.local_default }}"
          if git merge --no-edit "upstream/${{ steps.b.outputs.upstream_default }}"; then
            echo "merge 干净，无冲突"
          else
            # 冲突自动解决，否则这里 exit 1 会卡死整个同步循环：
            # push 步骤的“回退 workflow”提交让 fork 的 .github/workflows 永远固定在
            # 旧版本，而上游持续改动 deploy-to-docker.yaml，两边必然天天冲突，
            # 且冲突发生在本步骤，后面的兜底逻辑永远轮不到执行。
            # 规则：.github/ 保留 fork 本地版本（ours），其余文件采纳上游（theirs）。
            echo "merge 有冲突，自动解决"
            while IFS= read -r -d '' f; do
              case "$f" in
                .github/*)
                  git checkout --ours -- "$f" 2>/dev/null || git rm -q -f -- "$f" 2>/dev/null || true
                  echo "  保留 fork 版本(ours): $f"
                  ;;
                *)
                  git checkout --theirs -- "$f" 2>/dev/null || git rm -q -f -- "$f" 2>/dev/null || true
                  echo "  采纳上游版本(theirs): $f"
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U -z)
            git add -A
            git commit --no-edit
          fi

      - name: Setup Node.js for verification
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Verify (test + build) before pushing
        run: |
          # 合并后先验证，失败则不 push，避免破坏性改动无声进默认分支
          npm ci
          npm test
          npm run build

      - name: Push merged result
        run: |
          set -e
          # 未配置 SYNC_TOKEN 时回退 .github/workflows/：GITHUB_TOKEN 推送任何
          # workflow 变更（改/增/删都算）会被 GitHub 整次拒绝（refusing to allow
          # a GitHub App to create or update workflow ... without workflows permission）
          if [ -z "${SYNC_TOKEN:-}" ]; then
            # 关键一：必须回退到 origin/<branch> 而非 HEAD。merge 之后 HEAD 已是
            # 合并后的上游版本，git checkout HEAD -- .github/workflows 等于没回退。
            # 关键二：先删目录再恢复，做成对 origin/<branch> 的“镜像”——否则上游
            # 新增的 workflow 文件（新增不会触发 merge 冲突）会残留下来，push 照样
            # 被整次拒绝。
            rm -rf .github/workflows
            git checkout "origin/${{ steps.b.outputs.local_default }}" -- .github/workflows
            git add -A -- .github/workflows
            git commit --no-edit -m "chore(ci): keep local workflow files (no SYNC_TOKEN)" 2>/dev/null || true
          fi
          git push origin "${{ steps.b.outputs.local_default }}"

      - name: Sync tags
        run: git push --tags origin
