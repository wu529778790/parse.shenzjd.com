# Cloudflare Workers 部署配置（OpenNext 方案，替代原 next-on-pages）
# 构建：npm run build:cf → 产出 .open-next/ 目录（供 Cloudflare Git 集成构建使用）
# 自动部署：Dashboard 关联本仓库后，Build command=npm run build:cf，
# Deploy command=npx wrangler deploy；每次 push 到 main 由 Cloudflare 自动构建部署
name = "parse-shenzjd-com"
main = ".open-next/worker.js"
compatibility_date = "2025-08-14"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# 非敏感环境变量（DOUYIN_COOKIE / WEIBO_COOKIE 等敏感值
# 在 Worker 的 Settings → Variables and Secrets 中添加，不写入本文件）
[vars]
BILIBILI_USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
